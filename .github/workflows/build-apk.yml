
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Hc Bot App
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js 14
        uses: actions/setup-node@v4
        with:
          node-version: '14'
          
      - name: Set up JDK 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-29 build-tools;29.0.3'
          accept-android-sdk-licenses: true
          
      - name: Install Cordova
        run: npm install -g cordova@9.0.0
        
      - name: Check build environment
        run: |
          node --version
          npm --version
          cordova --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          
      - name: Validate project files
        shell: bash
        run: |
          set -e
          
          test -f config.xml || {
            echo "ERROR: config.xml tidak ditemukan."
            exit 1
          }
          
          test -f package.json || {
            echo "ERROR: package.json tidak ditemukan."
            exit 1
          }
          
          test -f www/index.html || {
            echo "ERROR: www/index.html tidak ditemukan."
            exit 1
          }
          
          test -f www/nodejs-project/main.js || {
            echo "ERROR: main.js Node.js Mobile tidak ditemukan."
            exit 1
          }
          
          echo "Struktur proyek valid."
          
      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          
      - name: Add Android platform
        run: cordova platform add android@9.1.0
        
      - name: Add Node.js Mobile plugin
        run: cordova plugin add nodejs-mobile-cordova
        
      
      - name: Show Cordova state
        shell: bash
        run: |
          echo "=== Cordova version ==="
          cordova --version
          
          echo "=== Installed platforms ==="
          cordova platform ls
          
          echo "=== Installed plugins ==="
          cordova plugin ls
          
          echo "=== Android project files ==="
          ls -la platforms/android || true
          
          echo "=== Gradle wrapper location ==="
          if [ -f platforms/android/gradlew ]; then
            echo "Gradle wrapper ditemukan."
          else
            echo "Gradle wrapper tidak ditemukan di lokasi standar."
            find platforms/android -maxdepth 4 \
              -name gradlew -type f -print || true
          fi
          
      - name: Build debug APK
       shell: bash
       run: |
       set -o pipefail
       cordova build android --debug --verbose 2>&1 | tee build.log
       
      - name: Find and collect APK
        if: success()
        shell: bash
        run: |
        set -e
          
          mkdir -p build-artifacts
          
          echo "Mencari APK debug..."
          
          APK_PATH="$(find platforms/android \
            -type f \
            -path '*/outputs/apk/debug/*.apk' \
            ! -name '*-androidTest*' \
            -print -quit)"
            
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK debug tidak ditemukan."
            find platforms/android -type f -name '*.apk' -print || true
            exit 1
          fi
          
          cp "$APK_PATH" build-artifacts/hc-bot-app-debug.apk
          
          echo "APK berhasil ditemukan:"
          ls -lh build-artifacts/hc-bot-app-debug.apk
          
          
    - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hc-bot-app-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
          
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hc-bot-app-debug-apk
          path: build-artifacts/hc-bot-app-debug.apk
          if-no-files-found: error
          retention-days: 7

