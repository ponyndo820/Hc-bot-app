      - name: Add Node.js Mobile plugin
        run: cordova plugin add nodejs-mobile-cordova
        
      - name: Build debug APK
        shell: bash
        run: |
          set -eo pipefail
          echo "Memeriksa platform Android..."
          test -d platforms/android
          echo "Menjalankan build Cordova..."
          cordova build android --debug --verbose
          echo "Memeriksa Gradle wrapper..."
          test -f platforms/android/gradlew
          echo "Membangun APK debug secara langsung..."
          cd platforms/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ../..
          
      - name: Find and collect APK
        shell: bash
        run: |
          set -e
          mkdir -p build-artifacts
          echo "Mencari APK hasil build..."
          find platforms/android -type f -name '*.apk' -print
          APK_PATH="$(find platforms/android -type f \
            -name '*.apk' \
            ! -name '*-androidTest*' \
            -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK tidak berhasil ditemukan."
            echo "Daftar folder output:"
            find platforms/android -type d \
              -path '*/build/outputs/*' -print || true
            exit 1
          fi
          cp "$APK_PATH" build-artifacts/hc-bot-app-debug.apk
          echo "APK berhasil ditemukan:"
          ls -lh build-artifacts/hc-bot-app-debug.apk
          
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hc-bot-app-debug-apk
          path: build-artifacts/hc-bot-app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
