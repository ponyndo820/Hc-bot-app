name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Hc Bot App
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js 16 (Wajib untuk plugin nodejs-mobile)
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-30 build-tools;30.0.3'
          accept-android-sdk-licenses: true
          
      - name: Install Cordova
        run: npm install -g cordova@10.0.0
        
      - name: Check build environment
        run: |
          node --version
          npm --version
          cordova --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          
      - name: Validate project files
        shell: bash
        run: |
          set -e
          if [ ! -f config.xml ]; then
            echo "ERROR: Missing config.xml"
            exit 1
          fi
          if [ ! -f package.json ]; then
            echo "ERROR: Missing package.json"
            exit 1
          fi
          if [ ! -f www/index.html ]; then
            echo "ERROR: Missing www/index.html"
            exit 1
          fi
          echo "Project structure looks valid."
          
      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --ignore-scripts
          fi
          
      - name: Add Android platform
        run: cordova platform add android@10.1.2
          
