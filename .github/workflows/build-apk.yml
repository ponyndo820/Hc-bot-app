name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Hc Bot App
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      # JDK 17 hanya untuk memasang Android SDK (sdkmanager terbaru butuh Java 17)
      - name: Set up JDK 17 (untuk sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-30 build-tools;30.0.3'
          accept-android-sdk-licenses: true

      # [PERBAIKAN] Cordova Android 10 membutuhkan Java 8 untuk membangun (Gradle 6.x tidak jalan di Java 17).
      # Harus SETELAH setup-android karena menimpa JAVA_HOME.
      - name: Set up JDK 8 (untuk build Cordova)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Cordova
        run: npm install -g cordova@10.0.0

      - name: Check build environment
        run: |
          node --version
          npm --version
          cordova --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Validate project files
        shell: bash
        run: |
          set -e
          test -f config.xml || { echo "ERROR: Missing config.xml"; exit 1; }
          test -f package.json || { echo "ERROR: Missing package.json"; exit 1; }
          test -f www/index.html || { echo "ERROR: Missing www/index.html"; exit 1; }
          test -f www/nodejs-project/main.js || { echo "ERROR: Missing www/nodejs-project/main.js"; exit 1; }
          echo "Project structure looks valid."

      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --ignore-scripts
          fi

      - name: Add Android platform
        run: cordova platform add android@10.1.2

      - name: Add Node.js Mobile plugin
        run: cordova plugin add nodejs-mobile-cordova

      # [PERBAIKAN] Info tambahan supaya mudah mencari penyebab error
      - name: Show Cordova state
        run: |
          cordova platform ls
          cordova plugin ls
          ls -la platforms/android || true

      # [PERBAIKAN] --verbose menampilkan alur lengkap dan stack trace error.
      # Cordova kadang mencetak error tapi tetap keluar dengan kode 0, jadi hasilnya
      # disimpan ke build.log dan dicek manual.
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          cordova build android --debug --verbose 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "Cordova keluar dengan kode $STATUS"
            exit "$STATUS"
          fi
          if grep -qE 'must be of type string|Error:|BUILD FAILED' build.log; then
            echo "Terdeteksi error di build.log (lihat bagian atasnya)."
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Find and collect APK
        shell: bash
        run: |
          set -e
          mkdir -p build-artifacts
          APK_PATH="$(find platforms/android -type f -path '*/outputs/apk/*/*.apk' ! -name '*-androidTest*' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found."
            find platforms/android -type f -name '*.apk' || true
            exit 1
          fi
          cp "$APK_PATH" build-artifacts/hc-bot-app-debug.apk
          ls -lh build-artifacts/hc-bot-app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hc-bot-app-debug-apk
          path: build-artifacts/hc-bot-app-debug.apk
          if-no-files-found: error
          retention-days: 7
