
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Hc Bot App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Mengambil kode proyek
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Menyiapkan Node.js untuk Cordova CLI
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      # 3. Java 17 diperlukan untuk Android SDK Command-line Tools
      - name: Set up JDK 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Menyiapkan Android SDK menggunakan Java 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-29 build-tools;29.0.3'
          accept-android-sdk-licenses: true

      # 5. Memastikan Android SDK sudah tersedia
      - name: Verify Android SDK
        run: |
          java -version
          sdkmanager --list_installed

      # 6. Beralih ke Java 8 untuk Cordova Android 9.1.0
      - name: Set up JDK 8 for Cordova
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # 7. Memeriksa lingkungan build
      - name: Check build environment
        run: |
          node --version
          npm --version
          cordova --version || true
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java"

      # 8. Memasang Cordova CLI versi 9
      - name: Install Cordova
        run: npm install -g cordova@9.0.0

      # 9. Memeriksa struktur proyek
      - name: Validate project files
        shell: bash
        run: |
          set -e

          test -f config.xml || {
            echo "ERROR: config.xml tidak ditemukan."
            exit 1
          }

          test -f package.json || {
            echo "ERROR: package.json tidak ditemukan."
            exit 1
          }

          test -f www/index.html || {
            echo "ERROR: www/index.html tidak ditemukan."
            exit 1
          }

          test -f www/nodejs-project/main.js || {
            echo "ERROR: main.js Node.js Mobile tidak ditemukan."
            exit 1
          }

          echo "Struktur dasar proyek valid."

      # 10. Memasang dependensi proyek
      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --ignore-scripts
          fi

      # 11. Menambahkan platform Android
      - name: Add Android platform
        run: cordova platform add android@9.1.0

      # 12. Memasang plugin Node.js Mobile
      - name: Add Node.js Mobile plugin
        run: cordova plugin add nodejs-mobile-cordova

      # 13. Membangun APK debug
      - name: Build debug APK
        run: cordova build android --debug

      # 14. Memastikan APK berhasil dibuat
      - name: Verify APK
        shell: bash
        run: |
          set -e

          mkdir -p build-artifacts

          APK="$(find platforms/android -type f \
            -path '*/outputs/apk/*/*.apk' \
            ! -name '*-androidTest*' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find platforms/android -type f -name '*.apk' || true
            exit 1
          fi

          cp "$APK" build-artifacts/hc-bot-app-debug.apk
          ls -lh build-artifacts/hc-bot-app-debug.apk

      # 15. Mengunggah APK ke GitHub Actions
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hc-bot-app-debug-apk
          path: build-artifacts/hc-bot-app-debug.apk
          if-no-files-found: error
          retention-days: 7
