name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Hc Bot App
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 14
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Set up JDK 17 (untuk sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-29 build-tools;29.0.3'
          accept-android-sdk-licenses: true

      - name: Set up JDK 8 (untuk build Gradle & Cordova)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 5.6.4
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-5.6.4-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-5.6.4/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle and Java
        run: |
          which gradle
          gradle --version
          java -version

      - name: Install Cordova
        run: npm install -g cordova@9.0.0

      - name: Check build environment
        run: |
          node --version
          npm --version
          cordova --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Validate project files
        shell: bash
        run: |
          set -e
          test -f config.xml || { echo "ERROR: Missing config.xml"; exit 1; }
          test -f package.json || { echo "ERROR: Missing package.json"; exit 1; }
          test -f www/index.html || { echo "ERROR: Missing www/index.html"; exit 1; }
          test -f www/nodejs-project/main.js || { echo "ERROR: Missing www/nodejs-project/main.js"; exit 1; }
          echo "Project structure looks valid."

      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --ignore-scripts
          fi

      - name: Ensure SDK preferences in config.xml
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          let config = fs.readFileSync("config.xml", "utf8");
          if (!config.includes("compileSdkVersion")) {
            config = config.replace("</widget>", "    <preference name=\"compileSdkVersion\" value=\"29\" />\n    <preference name=\"targetSdkVersion\" value=\"29\" />\n    <preference name=\"android-minSdkVersion\" value=\"21\" />\n</widget>");
            fs.writeFileSync("config.xml", config, "utf8");
            console.log("Successfully injected SDK preferences into config.xml");
          }
          '

      - name: Add Android platform & Node.js Mobile plugin
        run: |
          cordova platform add android@9.1.0
          cordova plugin add nodejs-mobile-cordova

      - name: Prepare Android Platform (Generate Files & Hooks)
        run: cordova prepare android

      - name: Inject Global Gradle SDK Force Override & JCenter Fix
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          // 1. Suntikkan skrip pemaksa SDK global ke root build.gradle
          const buildGradlePath = "platforms/android/build.gradle";
          if (fs.existsSync(buildGradlePath)) {
            let content = fs.readFileSync(buildGradlePath, "utf8");
            const overrideBlock = `
          // [FORCE OVERRIDE] Paksa semua subproject/plugin menggunakan SDK 29 dan MinSDK 21
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      if (project.android.hasProperty("compileSdkVersion")) {
                          project.android.compileSdkVersion = 29
                      }
                      if (project.android.hasProperty("defaultConfig")) {
                          project.android.defaultConfig.minSdkVersion = 21
                          project.android.defaultConfig.targetSdkVersion = 29
                      }
                  }
              }
          }
          `;
            if (!content.includes("FORCE OVERRIDE")) {
              content += overrideBlock;
              fs.writeFileSync(buildGradlePath, content, "utf8");
              console.log("Berhasil menyuntikkan Global Gradle SDK Override.");
            }
          }

          // 2. Perbaiki JCenter global dan pastikan repositori benar
          function fixGradleFiles(dir) {
            if (!fs.existsSync(dir)) return;
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            for (let entry of entries) {
              const fullPath = path.join(dir, entry.name);
              try {
                if (entry.isDirectory()) {
                  fixGradleFiles(fullPath);
                } else if (entry.isFile() && entry.name.endsWith(".gradle")) {
                  let c = fs.readFileSync(fullPath, "utf8");
                  c = c.replace(/jcenter\(\)/g, "mavenCentral()");
                  c = c.replace(/repositories\s*\{/g, "repositories {\n        google()\n        mavenCentral()");
                  fs.writeFileSync(fullPath, c, "utf8");
                }
              } catch (e) {}
            }
          }
          fixGradleFiles("platforms/android");
          fixGradleFiles("plugins");
          '

      - name: Clean Gradle Cache Safely
        run: |
          rm -rf ~/.gradle/caches/ || true
          rm -rf platforms/android/.gradle/ || true

      - name: Build debug APK Directly with Gradle
        shell: bash
        run: |
          set -o pipefail
          chmod +x platforms/android/gradlew
          platforms/android/gradlew assembleDebug --verbose 2>&1 | tee build.log

      - name: Find and collect APK
        if: success()
        shell: bash
        run: |
          set -e
          mkdir -p build-artifacts
          APK_PATH="$(find platforms/android -type f -path '*/outputs/apk/*/*.apk' ! -name '*-androidTest*' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found."
            find platforms/android -type f -name '*.apk' || true
            exit 1
          fi
          cp "$APK_PATH" build-artifacts/hc-bot-app-debug.apk
          ls -lh build-artifacts/hc-bot-app-debug.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hc-bot-app-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hc-bot-app-debug-apk
          path: build-artifacts/hc-bot-app-debug.apk
          if-no-files-found: error
          retention-days: 7
