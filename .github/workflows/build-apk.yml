name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Hc Bot App
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Set up JDK 17 (untuk sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-29 build-tools;29.0.3'
          accept-android-sdk-licenses: true

      - name: Set up JDK 8 (untuk build Gradle & Cordova)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 6.9.4
        shell: bash
        run: |
          set -e
          GRADLE_VERSION=6.9.4
          GRADLE_URL="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          echo "Downloading Gradle ${GRADLE_VERSION}..."
          for i in 1 2 3; do
            if curl -fL --retry 3 --retry-delay 5 -o /tmp/gradle.zip "$GRADLE_URL"; then
              echo "Download successful"
              break
            fi
            echo "Download attempt $i failed, retrying..."
            sleep 5
            if [ $i -eq 3 ]; then
              echo "ERROR: Failed to download Gradle after 3 attempts"
              exit 1
            fi
          done
          FILESIZE=$(stat -c%s /tmp/gradle.zip)
          echo "Downloaded size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 50000000 ]; then
            echo "ERROR: Downloaded file too small, download probably failed"
            exit 1
          fi
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          rm -f /tmp/gradle.zip
          echo "Gradle ${GRADLE_VERSION} installed successfully"

      - name: Verify Gradle and Java
        run: |
          which gradle
          gradle --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install Cordova
        run: npm install -g cordova@9.0.0

      - name: Check build environment
        run: |
          node --version
          npm --version
          cordova --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Validate project files
        shell: bash
        run: |
          set -e
          test -f config.xml || { echo "ERROR: Missing config.xml"; exit 1; }
          test -f package.json || { echo "ERROR: Missing package.json"; exit 1; }
          test -f www/index.html || { echo "ERROR: Missing www/index.html"; exit 1; }
          test -f www/nodejs-project/main.js || { echo "ERROR: Missing www/nodejs-project/main.js"; exit 1; }
          echo "Project structure looks valid."

      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --ignore-scripts
          fi

      - name: Ensure SDK preferences in config.xml
        shell: bash
        run: |
          node << 'NODESCRIPT'
          const fs = require("fs");
          let config = fs.readFileSync("config.xml", "utf8");
          if (!config.includes('name="compileSdkVersion"')) {
            const prefs = [
              '    <preference name="compileSdkVersion" value="29" />',
              '    <preference name="targetSdkVersion" value="29" />',
              '    <preference name="android-minSdkVersion" value="24" />',
              '    <preference name="android-compileSdkVersion" value="29" />',
              '    <preference name="android-targetSdkVersion" value="29" />'
            ].join("\n");
            config = config.replace("</widget>", prefs + "\n</widget>");
            fs.writeFileSync("config.xml", config, "utf8");
            console.log("SDK preferences added to config.xml");
          } else {
            console.log("SDK preferences already present");
          }
          NODESCRIPT

      - name: Add Platform, Plugin & Prepare Android
        shell: bash
        run: |
          set -e
          npm install cordova-android@9.1.0 nodejs-mobile-cordova --save
          cordova platform add ./node_modules/cordova-android --nofetch || true
          cordova plugin add ./node_modules/nodejs-mobile-cordova --nofetch || true
          cordova prepare android
          echo "Platform, plugin, and prepare completed successfully."

      - name: Permanent Hardcode SDK Patch & JCenter / versioncompare Fix
        shell: bash
        run: |
          node << 'NODESCRIPT'
          const fs = require("fs");
          const path = require("path");

          function removeGradleBlock(content, name) {
            const lines = content.split("\n");
            const out = [];
            const startRe = new RegExp("^\\s*" + name + "\\s*\\{");
            let i = 0;
            while (i < lines.length) {
              if (startRe.test(lines[i])) {
                let depth = 0;
                do {
                  const line = lines[i];
                  for (let c = 0; c < line.length; c++) {
                    if (line[c] === "{") depth++;
                    else if (line[c] === "}") depth--;
                  }
                  i++;
                } while (i < lines.length && depth > 0);
                continue;
              }
              out.push(lines[i]);
              i++;
            }
            return out.join("\n");
          }

