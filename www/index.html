<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval' http://localhost:* http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; media-src *; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src *">
  <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
  <title>Hc Bot App</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <main>
    <h1>Hc Bot App</h1>
    <p class="sub">Menjalankan bot WhatsApp langsung di HP dengan Node.js</p>

    <section class="card">
      <h2>Status mesin Node.js</h2>
      <div id="status" class="pill wait">Menunggu perangkat...</div>
      <dl id="info"></dl>
      <div id="warn" class="warn" hidden></div>
    </section>

    <section class="card">
      <h2>Uji komunikasi</h2>
      <button id="btnPing">Ping ke Node.js</button>
      <button id="btnInfo" class="ghost">Muat ulang info</button>
    </section>

    <section class="card">
      <h2>Pairing WhatsApp Bot</h2>
      <p class="sub" style="margin-bottom:10px">Tahap M2 (belum aktif). Pastikan status Node.js hijau dulu.</p>
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <input type="text" id="phoneNumber" placeholder="628xxxxxxxxxx"
               style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:#2a2a3c;color:#fff;font-size:14px;" />
        <button id="getPairBtn">Kirim</button>
      </div>
      <div id="pairingContainer" style="display:none;background:#2a2a3c;padding:12px;border-radius:8px;text-align:center;border:1px dashed #6366f1;">
        <p style="font-size:12px;color:#aaa;margin-bottom:4px;">KODE PAIRING ANDA:</p>
        <h2 id="pairingCodeDisplay" style="font-size:24px;color:#facc15;letter-spacing:2px;margin:0;">----</h2>
      </div>
    </section>

    <section class="card">
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>
  </main>

  <script src="cordova.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
