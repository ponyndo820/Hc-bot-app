name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Hc Bot App
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js 16 (Wajib untuk plugin nodejs-mobile)
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-30 build-tools;30.0.3'
          accept-android-sdk-licenses: true
          
      - name: Install Cordova
        run: npm install -g cordova@10.0.0
        
      - name: Check build environment
        run: |
          node --version
          npm --version
          cordova --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          
      - name: Validate project files
        shell: bash
        run: |
          set -e
          if [ ! -f config.xml ]; then
            echo "ERROR: Missing config.xml"
            exit 1
          fi
          if [ ! -f package.json ]; then
            echo "ERROR: Missing package.json"
            exit 1
          fi
          if [ ! -f www/index.html ]; then
            echo "ERROR: Missing www/index.html"
            exit 1
          fi
          echo "Project structure looks valid."
          
      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --ignore-scripts
          fi
          
      - name: Add Android platform
        run: cordova platform add android@10.1.2
          
      - name: Foolproof Patch for prepare.js (Node.js 16+ Fix)
        shell: node
        run: |
          const fs = require('fs');
          const targetFile = 'platforms/android/cordova/lib/prepare.js';
          if (fs.existsSync(targetFile)) {
            let content = fs.readFileSync(targetFile, 'utf8');
            // Menambal path.join agar tidak pernah menerima nilai undefined
            content = content.replace(
              /path\.join\(\s*cordovaProject\.root/g,
              'path.join((cordovaProject && cordovaProject.root) || process.cwd()'
            );
            fs.writeFileSync(targetFile, content, 'utf8');
            console.log('BERHASIL: prepare.js telah dipatch dengan aman.');
          } else {
            console.log('PERINGATAN: File prepare.js tidak ditemukan.');
          }

      - name: Add Node.js Mobile plugin
        run: cordova plugin add nodejs-mobile-cordova
        
      - name: Build debug APK
        shell: bash
        run: |
          set -eo pipefail
          echo "Memeriksa platform Android..."
          test -d platforms/android
          echo "Menjalankan build Cordova..."
          cordova build android --debug --verbose
          echo "Memeriksa Gradle wrapper..."
          test -f platforms/android/gradlew
          echo "Membangun APK debug secara langsung..."
          cd platforms/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ../..
          
      - name: Find and collect APK
        shell: bash
        run: |
          set -e
          mkdir -p build-artifacts
          echo "Mencari APK hasil build..."
          find platforms/android -type f -name '*.apk' -print
          APK_PATH="$(find platforms/android -type f \
            -name '*.apk' \
            ! -name '*-androidTest*' \
            -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK tidak berhasil ditemukan."
            echo "Daftar folder output:"
            find platforms/android -type d \
              -path '*/build/outputs/*' -print || true
            exit 1
          fi
          cp "$APK_PATH" build-artifacts/hc-bot-app-debug.apk
          echo "APK berhasil ditemukan:"
          ls -lh build-artifacts/hc-bot-app-debug.apk
          
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hc-bot-app-debug-apk
          path: build-artifacts/hc-bot-app-debug.apk
          if-no-files-found: error
          retention-days: 7
