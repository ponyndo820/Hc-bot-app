
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Hc Bot App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Ambil kode repositori
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Siapkan Node.js untuk Cordova CLI
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      # 3. Siapkan Java
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # 4. Siapkan Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-29 build-tools;29.0.3'

      # 5. Periksa file proyek
      - name: Validate project files
        shell: bash
        run: |
          set -e

          test -f config.xml || {
            echo "ERROR: config.xml tidak ditemukan."
            exit 1
          }

          test -f package.json || {
            echo "ERROR: package.json tidak ditemukan."
            exit 1
          }

          test -f www/index.html || {
            echo "ERROR: www/index.html tidak ditemukan."
            exit 1
          }

          test -f www/nodejs-project/main.js || {
            echo "ERROR: main.js Node.js Mobile tidak ditemukan."
            exit 1
          }

          echo "Struktur dasar proyek valid."

      # 6. Instal Cordova CLI
      - name: Install Cordova
        run: npm install --global cordova@9.0.0

      # 7. Periksa versi tool
      - name: Check build environment
        run: |
          node --version
          npm --version
          cordova --version
          java -version
          sdkmanager --list_installed

      # 8. Instal dependensi proyek utama
      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --ignore-scripts
          fi

      # 9. Tambahkan platform Android
      - name: Add Android platform
        run: cordova platform add android@9.1.0

      # 10. Tambahkan plugin Node.js Mobile
      - name: Add Node.js Mobile plugin
        run: cordova plugin add nodejs-mobile-cordova

      # 11. Build APK debug
      - name: Build debug APK
        run: cordova build android --debug

      # 12. Cari dan validasi APK hasil build
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find platforms/android -type f \
            -path '*/outputs/apk/*/*.apk' \
            ! -name '*-androidTest*' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find platforms/android -type f -name '*.apk' || true
            exit 1
          fi

          mkdir -p build-artifacts
          cp "$APK" build-artifacts/hc-bot-app-debug.apk

          echo "APK berhasil dibuat:"
          ls -lh build-artifacts/hc-bot-app-debug.apk

      # 13. Unggah APK ke GitHub Actions
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hc-bot-app-debug-apk
          path: build-artifacts/hc-bot-app-debug.apk
          if-no-files-found: error
          retention-days: 7
