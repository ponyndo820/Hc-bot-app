name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: subosito/android-action@v2
        with:
          target-sdk: android-30
          build-tools: 30.0.3
          platform-versions: platforms;android-30

      - name: Pasang Cordova Versi 9
        run: npm install -g cordova@9.0.0

      - name: Tambah platform Android dan plugin Node.js
        run: |
          cordova platform add android@9.1.0
          cordova plugin add nodejs-mobile-cordova

      - name: Bangun APK debug
        run: cordova build android --debug

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: hc-bot-app-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
