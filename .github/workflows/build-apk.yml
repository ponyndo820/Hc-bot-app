name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Hc Bot App
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 14
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Set up JDK 17 (untuk sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-29 build-tools;29.0.3'
          accept-android-sdk-licenses: true

      - name: Set up JDK 8 (untuk build Gradle & Cordova)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 5.6.4
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-5.6.4-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-5.6.4/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle and Java
        run: |
          which gradle
          gradle --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install Cordova
        run: npm install -g cordova@9.0.0

      - name: Check build environment
        run: |
          node --version
          npm --version
          cordova --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Validate project files
        shell: bash
        run: |
          set -e
          test -f config.xml || { echo "ERROR: Missing config.xml"; exit 1; }
          test -f package.json || { echo "ERROR: Missing package.json"; exit 1; }
          test -f www/index.html || { echo "ERROR: Missing www/index.html"; exit 1; }
          test -f www/nodejs-project/main.js || { echo "ERROR: Missing www/nodejs-project/main.js"; exit 1; }
          echo "Project structure looks valid."

      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --ignore-scripts
          fi

      - name: Ensure SDK preferences in config.xml
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          let config = fs.readFileSync("config.xml", "utf8");
          if (!config.includes("compileSdkVersion")) {
            config = config.replace("</widget>", "    <preference name=\"compileSdkVersion\" value=\"29\" />\n    <preference name=\"targetSdkVersion\" value=\"29\" />\n    <preference name=\"android-minSdkVersion\" value=\"24\" />\n</widget>");
            fs.writeFileSync("config.xml", config, "utf8");
          }
          '

      - name: Add Android platform & Node.js Mobile plugin
        run: |
          cordova platform add android@9.1.0
          cordova plugin add nodejs-mobile-cordova

      - name: Prepare Android Platform
        run: cordova prepare android

      - name: Debug - list platforms/android contents
        run: |
          echo "=== platforms/android structure ==="
          ls -la platforms/android/ || true
          echo "=== Looking for gradlew ==="
          find platforms/android -name "gradlew*" -type f || true
          echo "=== Looking for build.gradle ==="
          find platforms/android -name "build.gradle" -type f || true

      - name: Permanent Hardcode SDK Patch & JCenter / versioncompare Fix
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          function patchGradleFiles(dir) {
            if (!fs.existsSync(dir)) return;
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            for (let entry of entries) {
              const fullPath = path.join(dir, entry.name);
              try {
                if (entry.isDirectory()) {
                  patchGradleFiles(fullPath);
                } else if (entry.isFile() && (entry.name.endsWith(".gradle") || entry.name.endsWith(".gradle.kts"))) {
                  let content = fs.readFileSync(fullPath, "utf8");
                  const original = content;

                  // === FIX UTAMA: versioncompare yang sudah pindah dari JCenter ===
                  // Cordova Android 9.x pakai com.g00fy2:versioncompare:1.3.4 (mati)
                  content = content.replace(
                    /import\s+com\.g00fy2\.versioncompare\.Version/g,
                    "import io.github.g00fy2.versioncompare.Version"
                  );
                  content = content.replace(
                    /classpath\s+['"]com\.g00fy2:versioncompare:[^'"]+['"]/g,
                    "classpath \"io.github.g00fy2:versioncompare:1.5.0@jar\""
                  );
                  content = content.replace(
                    /com\.g00fy2:versioncompare:[0-9.]+/g,
                    "io.github.g00fy2:versioncompare:1.5.0"
                  );

                  // Hardcode SDK versions (hanya yang jelas)
                  content = content.replace(/compileSdkVersion\s+[^\n]+/g, "compileSdkVersion 29");
                  content = content.replace(/targetSdkVersion\s+[^\n]+/g, "targetSdkVersion 29");
                  content = content.replace(/minSdkVersion\s+[^\n]+/g, "minSdkVersion 24");
                  content = content.replace(/buildToolsVersion\s+[^\n]+/g, "buildToolsVersion \"29.0.3\"");

                  // Hanya ganti "unspecified" yang muncul sebagai nilai SDK (lebih aman)
                  content = content.replace(/(compileSdkVersion|targetSdkVersion|buildToolsVersion)\s+unspecified/gi, "$1 29");
                  content = content.replace(/minSdkVersion\s+unspecified/gi, "minSdkVersion 24");
                  content = content.replace(/cdvCompileSdkVersion\s*=\s*unspecified/gi, "cdvCompileSdkVersion = 29");
                  content = content.replace(/cdvTargetSdkVersion\s*=\s*unspecified/gi, "cdvTargetSdkVersion = 29");
                  content = content.replace(/cdvMinSdkVersion\s*=\s*unspecified/gi, "cdvMinSdkVersion = 24");

                  // Fix dead JCenter → mavenCentral + google
                  content = content.replace(/jcenter\(\)/g, "mavenCentral()");
                  // Hindari double google()/mavenCentral() kalau sudah ada
                  if (!content.includes("google()") || content.match(/repositories\s*\{[^}]*jcenter/)) {
                    content = content.replace(/repositories\s*\{/g, "repositories {\n        google()\n        mavenCentral()");
                  }

                  // Hapus bintray plugin yang juga sudah mati (jika muncul)
                  content = content.replace(/classpath\s+['"]com\.jfrog\.bintray\.gradle:gradle-bintray-plugin:[^'"]+['"]/g, "// removed dead bintray plugin");

                  if (content !== original) {
                    fs.writeFileSync(fullPath, content, "utf8");
                    console.log("Patched: " + fullPath);
                  }
                }
              } catch (e) {
                console.error("Error patching " + fullPath + ": " + e.message);
              }
            }
          }

          patchGradleFiles("platforms/android");
          patchGradleFiles("plugins");
          console.log("Berhasil menerapkan hardcode patch + versioncompare fix.");
          '

      - name: Clean Gradle Cache Safely
        run: |
          rm -rf ~/.gradle/caches/ || true
          rm -rf platforms/android/.gradle/ || true

      - name: Ensure Gradle Wrapper exists
        shell: bash
        run: |
          set -e
          if [ ! -f platforms/android/gradlew ]; then
            echo "gradlew tidak ditemukan. Generating Gradle Wrapper..."
            cd platforms/android
            # Generate wrapper menggunakan Gradle 5.6.4 yang sudah diinstall
            gradle wrapper --gradle-version 5.6.4
            cd ../..
          fi
          chmod +x platforms/android/gradlew
          ls -la platforms/android/gradlew
          echo "Gradle Wrapper siap."

      - name: Build APK Directly with Gradle (Bypass Cordova Build Loop)
        shell: bash
        run: |
          set -o pipefail
          cd platforms/android
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee ../../build.log
          cd ../..

      - name: Find and collect APK
        if: success()
        shell: bash
        run: |
          set -e
          mkdir -p build-artifacts
          APK_PATH="$(find platforms/android -type f -path '*/outputs/apk/*/*.apk' ! -name '*-androidTest*' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found."
            find platforms/android -type f -name '*.apk' || true
            exit 1
          fi
          cp "$APK_PATH" build-artifacts/hc-bot-app-debug.apk
          ls -lh build-artifacts/hc-bot-app-debug.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hc-bot-app-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hc-bot-app-debug-apk
          path: build-artifacts/hc-bot-app-debug.apk
          if-no-files-found: error
          retention-days: 7