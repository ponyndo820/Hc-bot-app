
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Hc Bot App
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Mengambil kode repositori
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js untuk menjalankan Cordova CLI
      - name: Set up Node.js 14
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      # 3. Java 17 untuk Android SDK Command-line Tools
      - name: Set up JDK 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Menyiapkan Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-29 build-tools;29.0.3'
          accept-android-sdk-licenses: true

      # 5. Beralih ke Java 8 untuk Cordova Android 9
      - name: Set up JDK 8 for Cordova
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # 6. Memasang Cordova CLI
      - name: Install Cordova
        run: npm install -g cordova@9.0.0

      # 7. Memeriksa lingkungan build
      - name: Check build environment
        run: |
          node --version
          npm --version
          cordova --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      # 8. Memvalidasi file proyek
      - name: Validate project files
        shell: bash
        run: |
          set -e

          test -f config.xml || {
            echo "ERROR: config.xml tidak ditemukan."
            exit 1
          }

          test -f package.json || {
            echo "ERROR: package.json tidak ditemukan."
            exit 1
          }

          test -f www/index.html || {
            echo "ERROR: www/index.html tidak ditemukan."
            exit 1
          }

          test -f www/nodejs-project/main.js || {
            echo "ERROR: main.js Node.js Mobile tidak ditemukan."
            exit 1
          }

          echo "Struktur proyek valid."

      # 9. Memasang dependensi proyek
      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 10. Menambahkan platform Android
      - name: Add Android platform
        run: cordova platform add android@9.1.0

      # 11. Memasang plugin Node.js Mobile
      - name: Add Node.js Mobile plugin
        run: cordova plugin add nodejs-mobile-cordova

      # 12. Memeriksa platform dan plugin
      - name: Show Cordova state
        run: |
          cordova platform ls
          cordova plugin ls
          test -f platforms/android/gradlew

      # 13. Membangun APK dan menyimpan log
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail

          cordova build android --debug --verbose 2>&1 | tee build.log

      # 14. Mengumpulkan APK debug
      - name: Find and collect APK
        if: success()
        shell: bash
        run: |
          set -e

          mkdir -p build-artifacts

          echo "Mencari APK debug..."

          APK_PATH="$(find platforms/android \
            -type f \
            -path '*/outputs/apk/debug/*.apk' \
            ! -name '*-androidTest*' \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK debug tidak ditemukan."
            find platforms/android -type f -name '*.apk' -print || true
            exit 1
          fi

          cp "$APK_PATH" build-artifacts/hc-bot-app-debug.apk

          echo "APK berhasil ditemukan:"
          ls -lh build-artifacts/hc-bot-app-debug.apk

      # 15. Mengunggah log, termasuk jika build gagal
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hc-bot-app-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # 16. Mengunggah APK jika berhasil dibuat
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hc-bot-app-debug-apk
          path: build-artifacts/hc-bot-app-debug.apk
          if-no-files-found: error
          retention-days: 7
