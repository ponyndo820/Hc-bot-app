name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Hc Bot App
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 14
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Set up JDK 17 (untuk sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-29 build-tools;29.0.3'
          accept-android-sdk-licenses: true

      - name: Set up JDK 8 (untuk build Cordova)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 6.9.4 (untuk Cordova 9)
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-6.9.4-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-6.9.4/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle and Java
        run: |
          which gradle
          gradle --version
          java -version

      - name: Install Cordova
        run: npm install -g cordova@9.0.0

      - name: Check build environment
        run: |
          node --version
          npm --version
          cordova --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          gradle --version || true

      - name: Validate project files
        shell: bash
        run: |
          set -e
          test -f config.xml || { echo "ERROR: Missing config.xml"; exit 1; }
          test -f package.json || { echo "ERROR: Missing package.json"; exit 1; }
          test -f www/index.html || { echo "ERROR: Missing www/index.html"; exit 1; }
          test -f www/nodejs-project/main.js || { echo "ERROR: Missing www/nodejs-project/main.js"; exit 1; }
          echo "Project structure looks valid."

      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --ignore-scripts
          fi

      - name: Add Android platform
        run: cordova platform add android@9.1.0

      - name: Add Node.js Mobile plugin
        run: cordova plugin add nodejs-mobile-cordova

      # [PERBAIKAN] Suntikkan google() dan mavenCentral() secara spesifik ke buildscript & allprojects
      - name: Precise Patch for build.gradle Repositories
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          const gradlePath = "platforms/android/build.gradle";
          if (fs.existsSync(gradlePath)) {
            let content = fs.readFileSync(gradlePath, "utf8");
            
            // Tambahkan ke buildscript repositories
            content = content.replace(/buildscript\s*\{([\s\S]*?)\}/, (match, inner) => {
              if (!inner.includes("google()")) {
                inner = inner.replace(/repositories\s*\{/, "repositories {\n        google()\n        mavenCentral()");
              }
              return `buildscript {${inner}}`;
            });

            // Tambahkan ke allprojects repositories
            content = content.replace(/allprojects\s*\{([\s\S]*?)\}/, (match, inner) => {
              if (!inner.includes("google()")) {
                inner = inner.replace(/repositories\s*\{/, "repositories {\n        google()\n        mavenCentral()");
              }
              return `allprojects {${inner}}`;
            });

            fs.writeFileSync(gradlePath, content, "utf8");
            console.log("SUCCESS: build.gradle repositories patched precisely.");
          } else {
            console.log("ERROR: build.gradle not found!");
          }
          '

      - name: Patch Gradle dependencies (Fix implementation method)
        shell: bash
        run: |
          echo "Mengubah implementation ke compile pada file .gradle..."
          find platforms/android -name "*.gradle" -exec sed -i 's/\bimplementation\b/compile/g' {} +
          echo "Patch Gradle selesai."

      - name: Show Cordova state
        run: |
          cordova platform ls
          cordova plugin ls
          ls -la platforms/android || true

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          cordova build android --debug --verbose 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "Cordova keluar dengan kode $STATUS"
            exit "$STATUS"
          fi
          if grep -qE 'must be of type string|Error:|BUILD FAILED' build.log; then
            echo "Terdeteksi error di build.log (lihat bagian atasnya)."
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Find and collect APK
        shell: bash
        run: |
          set -e
          mkdir -p build-artifacts
          APK_PATH="$(find platforms/android -type f -path '*/outputs/apk/*/*.apk' ! -name '*-androidTest*' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found."
            find platforms/android -type f -name '*.apk' || true
            exit 1
          fi
          cp "$APK_PATH" build-artifacts/hc-bot-app-debug.apk
          ls -lh build-artifacts/hc-bot-app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hc-bot-app-debug-apk
          path: build-artifacts/hc-bot-app-debug.apk
          if-no-files-found: error
          retention-days: 7
